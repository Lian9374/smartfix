events { worker_connections 2048; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream core_pool {
    zone core_pool 64k;
    server core:8080 resolve;
  }
  server {
    listen 80;
    client_max_body_size 16m;
    location /internal/ { return 403; }
    location /actuator/ { return 403; }
    location = /healthz { proxy_pass http://core_pool/actuator/health; }
    location / {
      proxy_pass http://core_pool;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header X-SmartFix-Upstream $upstream_addr always;
    }
  }
}
