include classpath("application.conf")
node-address { protocol = http, host = "sqs", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }
queues {
  smartfix-notifications-dlq { defaultVisibilityTimeout = 120 seconds }
  smartfix-notifications {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "smartfix-notifications-dlq", maxReceiveCount = 5 }
  }
}
