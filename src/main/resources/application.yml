# ============================================================
# SmartFix - base Spring Boot configuration
# ------------------------------------------------------------
# Local development works without any profile as long as PostgreSQL
# is reachable (start it first: docker compose up -d db).
#
# Datasource values come from environment variables (see .env.example)
# with local-development defaults that match docker-compose.yml.
# No real credentials live here.
# ============================================================
spring:
  application:
    name: smartfix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartfix}
    username: ${DB_USERNAME:smartfix}
    password: ${DB_PASSWORD:smartfix}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema. Hibernate must never create or update production tables.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # V1 baseline + V2 accounts; future modules append migrations.
  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false   # dev-friendly; override to true for prod-style runs

  servlet: 
    multipart:
      max-file-size: ${SMARTFIX_UPLOAD_MAX_FILE_SIZE:5242880}
      max-request-size: ${SMARTFIX_UPLOAD_MAX_TOTAL_SIZE:15728640}

server:
  port: 8080
  servlet:
    session:
      timeout: ${SMARTFIX_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SMARTFIX_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

smartfix:
  bootstrap-admin:
    enabled: ${SMARTFIX_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${SMARTFIX_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${SMARTFIX_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${SMARTFIX_BOOTSTRAP_ADMIN_DISPLAY_NAME:SmartFix Administrator}

  uploads:
    dir: ${SMARTFIX_UPLOAD_DIR:uploads}
    max-size: ${SMARTFIX_UPLOAD_MAX_FILE_SIZE:5242880}
    max-files: ${SMARTFIX_UPLOAD_MAX_FILES:3}
    max-total-size: ${SMARTFIX_UPLOAD_MAX_TOTAL_SIZE:15728640}
    max-dimension: ${SMARTFIX_UPLOAD_MAX_DIMENSION:10000}
    max-pixels: ${SMARTFIX_UPLOAD_MAX_PIXELS:20000000}

# Health endpoint used to verify the application is up.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
