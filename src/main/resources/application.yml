# ============================================================
# SmartFix - base Spring Boot configuration
# ------------------------------------------------------------
# Local development works without any profile as long as PostgreSQL
# is reachable (start it first: docker compose up -d db).
#
# Datasource values come from environment variables (see .env.example)
# with local-development defaults that match docker-compose.yml.
# No real credentials live here.
# ============================================================
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  application:
    name: smartfix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartfix}
    username: ${DB_USERNAME:smartfix}
    password: ${DB_PASSWORD:smartfix}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema. Hibernate must never create or update production tables.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # V1 baseline + V2 accounts; future modules append migrations.
  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false   # dev-friendly; override to true for prod-style runs

  mail:
    host: ${SMARTFIX_SMTP_HOST:localhost}
    port: ${SMARTFIX_SMTP_PORT:25}
    username: ${SMARTFIX_SMTP_USERNAME:}
    password: ${SMARTFIX_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMARTFIX_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMARTFIX_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet: 
    multipart:
      max-file-size: ${SMARTFIX_UPLOAD_MAX_FILE_SIZE:5242880}
      max-request-size: ${SMARTFIX_UPLOAD_MAX_TOTAL_SIZE:15728640}

server:
  port: 8080
  # Registration uses the connection peer. Never trust arbitrary forwarding headers.
  # A trusted proxy / shared ingress limiter needs explicit deployment configuration.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: ${SMARTFIX_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SMARTFIX_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

smartfix:
  sla:
    scan-milliseconds: ${SMARTFIX_SLA_SCAN_MILLISECONDS:60000}
  notification:
    delivery:
      max-attempts: ${SMARTFIX_DELIVERY_MAX_ATTEMPTS:4}
      batch-size: ${SMARTFIX_DELIVERY_BATCH_SIZE:50}
      retry-seconds: ${SMARTFIX_DELIVERY_RETRY_SECONDS:1}
      scan-milliseconds: ${SMARTFIX_DELIVERY_SCAN_MILLISECONDS:15000}
      scheduling-enabled: ${SMARTFIX_DELIVERY_SCHEDULING_ENABLED:true}
      eager-enabled: ${SMARTFIX_DELIVERY_EAGER_ENABLED:true}
    email:
      enabled: ${SMARTFIX_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${SMARTFIX_NOTIFICATION_EMAIL_FROM:smartfix@localhost}
  registration:
    rate-limit:
      max-per-address: ${SMARTFIX_REGISTRATION_MAX_PER_ADDRESS:5}
      window: ${SMARTFIX_REGISTRATION_WINDOW:PT1H}
      max-global-per-minute: ${SMARTFIX_REGISTRATION_MAX_GLOBAL_PER_MINUTE:100}
      max-addresses: ${SMARTFIX_REGISTRATION_MAX_ADDRESSES:4096}
  bootstrap-admin:
    enabled: ${SMARTFIX_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${SMARTFIX_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${SMARTFIX_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${SMARTFIX_BOOTSTRAP_ADMIN_DISPLAY_NAME:SmartFix Administrator}

  request:
    workflow:
      reopen-window: ${SMARTFIX_REQUEST_REOPEN_WINDOW:0s}

  uploads:
    dir: ${SMARTFIX_UPLOAD_DIR:uploads}
    max-file-size: ${SMARTFIX_UPLOAD_MAX_FILE_SIZE:5242880}
    max-files: ${SMARTFIX_UPLOAD_MAX_FILES:3}
    max-total-size: ${SMARTFIX_UPLOAD_MAX_TOTAL_SIZE:15728640}
    max-dimension: ${SMARTFIX_UPLOAD_MAX_DIMENSION:10000}
    max-pixels: ${SMARTFIX_UPLOAD_MAX_PIXELS:20000000}

# Health endpoint used to verify the application is up.
management:
  health:
    mail:
      enabled: ${SMARTFIX_SMTP_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
