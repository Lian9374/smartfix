# ============================================================
# SmartFix - base Spring Boot configuration
# ------------------------------------------------------------
# Local development works without any profile as long as PostgreSQL
# is reachable (start it first: docker compose up -d db).
#
# Datasource values come from environment variables (see .env.example)
# with local-development defaults that match docker-compose.yml.
# No real credentials live here.
# ============================================================
spring:
  application:
    name: smartfix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartfix}
    username: ${DB_USERNAME:smartfix}
    password: ${DB_PASSWORD:smartfix}
    driver-class-name: org.postgresql.Driver

  # No domain model / schema exists yet. Hibernate must never create tables:
  # the SmartFix schema will be introduced via Flyway migrations AFTER domain
  # modelling / class design is approved for each Sprint story.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # Flyway is wired up but currently has only an intentionally-empty baseline
  # migration (V1). Real tables are added by future story migrations.
  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false   # dev-friendly; override to true for prod-style runs

server:
  port: 8080

# Health endpoint used to verify the application is up.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
