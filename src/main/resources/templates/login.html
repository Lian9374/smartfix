<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · SmartFix</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site-header"><span class="brand">SmartFix</span></header>
<main class="content auth-card">
    <h1>Sign in</h1>
    <p>Campus Facility Maintenance and Technician Dispatch System</p>
    <p role="alert" th:if="${param.error}">Invalid username or password.</p>
    <p role="status" th:if="${param.logout}">You have signed out.</p>
    <p role="status" th:if="${param.expired}">Your session is no longer valid. Please sign in again.</p>
    <form th:action="@{/login}" method="post">
        <p><label for="username">Username</label><br>
            <input id="username" name="username" autocomplete="username" required autofocus></p>
        <p><label for="password">Password</label><br>
            <input id="password" name="password" type="password" autocomplete="current-password" required></p>
        <button type="submit">Sign in</button>
    </form>
    <p class="hint">Contact your administrator if you need an account.</p>
</main>
</body>
</html>
