<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"><title>Change password · SmartFix</title></head>
<body><div class="app-shell"><th:block th:replace="~{fragments/layout :: sidebar('account')}"></th:block><div class="app-main"><th:block th:replace="~{fragments/layout :: appbar('account')}"></th:block>
<main id="main-content" class="content workspace-page">
<div class="workspace-editor"><section class="card page-context"><span class="section-kicker">Account security</span><h1>Change password</h1><p th:if="${requiredChange}">Set a personal password before using your account.</p><p th:unless="${requiredChange}">Changing your password signs out all existing sessions.</p></section>
<section class="card"><div class="card__body"><div class="alert alert--error" role="alert" tabindex="-1" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<form method="post" th:action="@{/account/password}"><div class="form-field"><label for="current-password">Current or temporary password</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required maxlength="72"></div>
<div class="form-field"><label for="new-password">New password</label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="72" aria-describedby="password-policy"></div>
<p class="form-field__hint" id="password-policy">At least 12 characters with a letter and a digit; at most 72 UTF-8 bytes. Choose a different password.</p>
<div class="form-field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="72"></div>
<div class="form-actions"><button class="btn btn--primary" type="submit">Change password &amp; sign out</button><a class="btn btn--secondary" th:unless="${requiredChange}" th:href="@{/}">Cancel</a></div></form></div></section></div></main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block></div></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
