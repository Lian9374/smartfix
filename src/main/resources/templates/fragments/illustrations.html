<!DOCTYPE html>
<!--
  Original campus artwork, drawn for this product and kept here as the one place
  it lives. Nothing is traced, imported or licensed from anywhere: every shape
  below is a rectangle, a circle or a curve written by hand.

  One visual language across all three pieces, so they read as a family:

    * geometry    - buildings are axis-aligned blocks on a shared ground line;
                    trees are circles on short trunks; markers are one pin path
                    reused at different scales.
    * stroke      - 1.5px everywhere, round caps and joins, on detail only
                    (window panes, ground line, path edges). Masses are fills.
    * depth       - three opacity planes. Far masses sit at .09, the mid blocks
                    at .15-.20, the foreground at full mint. Near shapes overlap
                    far ones, which is what makes the layers read as distance
                    rather than as a flat row of rectangles.
    * palette     - white at several opacities on the teal panels, mint #E7F2ED
                    for greenery and the foreground, and one warm accent
                    (#E0A458) used on a single facility marker. The warm colour
                    covers well under 1% of the drawing: it is a point of
                    interest, not a second theme.
    * subject     - buildings, window panes, a walkway, greenery and two
                    abstract facility markers. No logo, no photograph, and
                    deliberately no numbers, counts or charts - there is no real
                    telemetry behind this product to draw.

  Every piece is decorative: aria-hidden and focusable="false", so a screen
  reader skips it. The heading and text beside each one carry the meaning, and
  nothing here is needed to operate the page.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  The sign-in hero. Drawn for a dark teal panel, so it is built from white at
  low opacity rather than from page tokens: a token that reads as a light grey
  on white would disappear here.

  viewBox is 520x340 with the ground line at y=286, leaving the strip below it
  for the walkway that runs toward the viewer.
-->
<svg th:fragment="campusHero" class="campus-art campus-art--hero"
     viewBox="0 0 520 340" fill="none" xmlns="http://www.w3.org/2000/svg"
     aria-hidden="true" focusable="false">

  <!-- Far plane: two masses, no detail. They only suggest that the campus
       continues past the buildings that are drawn. -->
  <rect x="36" y="150" width="120" height="136" fill="#ffffff" fill-opacity=".09"/>
  <rect x="392" y="96" width="66" height="190" fill="#ffffff" fill-opacity=".09"/>

  <!-- Mid plane. The main block sits forward of the two wings, which sit forward
       of the far masses above; the overlaps are what carry the depth. -->
  <rect x="176" y="168" width="168" height="118" fill="#ffffff" fill-opacity=".20"/>
  <rect x="88" y="206" width="88" height="80" fill="#ffffff" fill-opacity=".15"/>
  <rect x="344" y="198" width="88" height="88" fill="#ffffff" fill-opacity=".15"/>

  <!-- Window panes. One 22x26 cell on a 30/34 pitch fills the main block; the
       wings repeat the same cell at a 17x26 step. Drawing them from one cell
       size is what keeps the three facades looking like one architecture. -->
  <g stroke="#ffffff" stroke-opacity=".26" stroke-width="1.5">
    <rect x="188" y="180" width="22" height="26" rx="2"/>
    <rect x="218" y="180" width="22" height="26" rx="2"/>
    <rect x="248" y="180" width="22" height="26" rx="2"/>
    <rect x="278" y="180" width="22" height="26" rx="2"/>
    <rect x="308" y="180" width="22" height="26" rx="2"/>
    <rect x="188" y="214" width="22" height="26" rx="2"/>
    <rect x="218" y="214" width="22" height="26" rx="2"/>
    <rect x="248" y="214" width="22" height="26" rx="2"/>
    <rect x="278" y="214" width="22" height="26" rx="2"/>
    <rect x="308" y="214" width="22" height="26" rx="2"/>
    <rect x="188" y="248" width="22" height="26" rx="2"/>
    <rect x="218" y="248" width="22" height="26" rx="2"/>
    <rect x="248" y="248" width="22" height="26" rx="2"/>
    <rect x="278" y="248" width="22" height="26" rx="2"/>
    <rect x="308" y="248" width="22" height="26" rx="2"/>
    <rect x="98" y="216" width="17" height="26" rx="2"/>
    <rect x="123" y="216" width="17" height="26" rx="2"/>
    <rect x="148" y="216" width="17" height="26" rx="2"/>
    <rect x="98" y="250" width="17" height="26" rx="2"/>
    <rect x="123" y="250" width="17" height="26" rx="2"/>
    <rect x="148" y="250" width="17" height="26" rx="2"/>
    <rect x="354" y="208" width="17" height="30" rx="2"/>
    <rect x="379" y="208" width="17" height="30" rx="2"/>
    <rect x="404" y="208" width="17" height="30" rx="2"/>
    <rect x="354" y="246" width="17" height="30" rx="2"/>
    <rect x="379" y="246" width="17" height="30" rx="2"/>
    <rect x="404" y="246" width="17" height="30" rx="2"/>
  </g>

  <!-- Ground line, then the walkway running out of the middle of it. -->
  <path d="M8 286h504" stroke="#ffffff" stroke-opacity=".30" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M232 286h56l42 40H190z" fill="#ffffff" fill-opacity=".07"/>
  <path d="M232 286 190 326M288 286l42 40"
        stroke="#ffffff" stroke-opacity=".16" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Foreground greenery, overlapping the buildings behind it. -->
  <rect x="49" y="252" width="6" height="34" fill="#ffffff" fill-opacity=".22"/>
  <circle cx="52" cy="250" r="26" fill="#E7F2ED" fill-opacity=".5"/>
  <rect x="465" y="250" width="6" height="36" fill="#ffffff" fill-opacity=".22"/>
  <circle cx="468" cy="246" r="30" fill="#E7F2ED" fill-opacity=".45"/>

  <!-- Two facility markers. One pin path, reused: the warm one marks the main
       block, the mint one a wing. The pin is drawn with its tip at the origin
       and its bulb above, so translate() puts it exactly where it points. -->
  <g transform="translate(260 166)">
    <path d="M0 0C-6.5-7.6-10-12.4-10-16.5a10 10 0 0 1 20 0C10-12.4 6.5-7.6 0 0z"
          fill="#E0A458"/>
    <circle cx="0" cy="-16.5" r="3.6" fill="#164D47"/>
  </g>
  <g transform="translate(388 196)">
    <path d="M0 0C-6.5-7.6-10-12.4-10-16.5a10 10 0 0 1 20 0C10-12.4 6.5-7.6 0 0z"
          fill="#E7F2ED" fill-opacity=".85"/>
    <circle cx="0" cy="-16.5" r="3.6" fill="#164D47" fill-opacity=".55"/>
  </g>
</svg>

<!--
  The same campus, reduced to a single massing, for the welcome band on the
  overview. It is read at roughly a third of the hero's size, so the window grid
  drops from fifteen cells to six and the trees to one: at that scale the hero's
  detail would turn into texture.

  Drawn on a light mint ground, so unlike the hero it is built from the brand
  colour on white rather than from white on teal.
-->
<svg th:fragment="campusAside" class="campus-art campus-art--aside"
     viewBox="0 0 240 150" fill="none" xmlns="http://www.w3.org/2000/svg"
     aria-hidden="true" focusable="false">

  <!-- Far plane. -->
  <rect x="18" y="56" width="52" height="66" fill="#246B63" fill-opacity=".10"/>

  <!-- Mid plane: main block and one wing. -->
  <rect x="86" y="34" width="94" height="88" fill="#246B63" fill-opacity=".16"/>
  <rect x="176" y="60" width="48" height="62" fill="#246B63" fill-opacity=".12"/>

  <!-- Window panes: the same 22x26 cell as the hero, at a 30/34 pitch. -->
  <g stroke="#246B63" stroke-opacity=".30" stroke-width="1.5">
    <rect x="98" y="46" width="22" height="26" rx="2"/>
    <rect x="128" y="46" width="22" height="26" rx="2"/>
    <rect x="158" y="46" width="22" height="26" rx="2"/>
    <rect x="98" y="80" width="22" height="26" rx="2"/>
    <rect x="128" y="80" width="22" height="26" rx="2"/>
    <rect x="158" y="80" width="22" height="26" rx="2"/>
    <rect x="186" y="74" width="14" height="20" rx="2"/>
    <rect x="206" y="74" width="14" height="20" rx="2"/>
    <rect x="186" y="100" width="14" height="20" rx="2"/>
    <rect x="206" y="100" width="14" height="20" rx="2"/>
  </g>

  <!-- Ground and walkway. -->
  <path d="M6 122h228" stroke="#246B63" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112 122h24l18 22h-60z" fill="#246B63" fill-opacity=".08"/>

  <!-- Foreground tree, overlapping the far mass behind it. -->
  <rect x="36" y="100" width="5" height="22" fill="#246B63" fill-opacity=".30"/>
  <circle cx="38.5" cy="98" r="17" fill="#246B63" fill-opacity=".22"/>

  <!-- One marker, in the warm accent, at the same tip-at-origin geometry. -->
  <g transform="translate(132 32)">
    <path d="M0 0C-6.5-7.6-10-12.4-10-16.5a10 10 0 0 1 20 0C10-12.4 6.5-7.6 0 0z"
          fill="#E0A458"/>
    <circle cx="0" cy="-16.5" r="3.6" fill="#ffffff"/>
  </g>
</svg>

<!--
  Empty state for a list nobody has filled yet. A request slip, not a folder:
  the thing this product is missing is the slip itself, and a slip is what the
  reader will see once one exists.

  Read on a white card, so it is drawn from the page's own light tones with one
  brand-coloured marker, and it sits inside a 200x140 box so a list page and the
  overview can show it at the sizes each needs.
-->
<svg th:fragment="requestEmpty" class="campus-art campus-art--empty"
     viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg"
     aria-hidden="true" focusable="false">

  <!-- Soft ground shadow, so the slip sits on something. -->
  <ellipse cx="100" cy="124" rx="46" ry="6" fill="#E7F2ED"/>

  <!-- The slip: a sheet with a mint header band. -->
  <rect x="48" y="18" width="104" height="100" rx="8" fill="#ffffff"
        stroke="#E1E8E5" stroke-width="1.5"/>
  <path d="M48 26a8 8 0 0 1 8-8h88a8 8 0 0 1 8 8v18H48z" fill="#E7F2ED"/>

  <!-- The marker on the header band, at the same tip-at-origin geometry. -->
  <g transform="translate(120 36) scale(.78)">
    <path d="M0 0C-6.5-7.6-10-12.4-10-16.5a10 10 0 0 1 20 0C10-12.4 6.5-7.6 0 0z"
          fill="#246B63"/>
    <circle cx="0" cy="-16.5" r="3.6" fill="#ffffff"/>
  </g>

  <!-- Three lines of unwritten text. -->
  <g fill="#E1E8E5">
    <rect x="64" y="60" width="72" height="7" rx="3.5"/>
    <rect x="64" y="76" width="54" height="7" rx="3.5"/>
    <rect x="64" y="92" width="64" height="7" rx="3.5"/>
  </g>
</svg>

</body>
</html>
