<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Announcements')}">
  <title>Announcements | SmartFix</title>
</head>

<body>
<div class="app-shell">

  <th:block th:replace="~{fragments/layout :: sidebar('announcements')}"></th:block>

  <div class="app-main">

    <th:block th:replace="~{fragments/layout :: appbar('announcements')}"></th:block>

    <main id="main-content" class="content announcements-page">

      <div class="card workspace-heading">
        <div class="page-head">
          <h1 class="page-head__title">Announcements</h1>
          <p class="page-head__subtitle">
            What’s happening around campus.
          </p>
        </div>
      </div>

      <section class="announcement-directory" aria-label="Current announcements">

          <div class="card announcement-empty" th:if="${#lists.isEmpty(announcements)}"><span class="announcement-empty__mark" aria-hidden="true">✓</span><div><h2>You’re all caught up</h2><p>No current announcements.</p></div></div>

          <article class="card announcement-detail" th:each="announcement : ${announcements}" th:id="|announcement-${announcement.id}|" th:attr="aria-labelledby=|announcement-title-${announcement.id}|">
            <span class="section-kicker">CAMPUS NOTICE</span>
            <h2 th:id="|announcement-title-${announcement.id}|" th:text="${announcement.title}">
              Announcement title
            </h2>

            <p class="announcement-detail__content" th:text="${announcement.content}">
              Announcement content
            </p>

            <div class="announcement-dates"><p>
              <span>From</span>
              <time th:datetime="${announcement.validFrom}" th:text="${#temporals.format(announcement.validFrom.atZone(T(java.time.ZoneId).of('Asia/Singapore')), 'dd MMM yyyy · HH:mm')}">
                Start time
              </time>
            </p>

            <p th:if="${announcement.validTo != null}">
              <span>Until</span>
              <time th:datetime="${announcement.validTo}" th:text="${#temporals.format(announcement.validTo.atZone(T(java.time.ZoneId).of('Asia/Singapore')), 'dd MMM yyyy · HH:mm')}">
                End time
              </time>
            </p><span class="announcement-timezone">Singapore time</span></div>

          </article>

      </section>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
