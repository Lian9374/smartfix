<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Order - SmartFix</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body><header><h1>Work Order</h1><nav><a th:href="@{/}">Home</a></nav></header><main>
<p><a th:href="@{/workorders/mine}">My work orders</a> · <a th:href="@{/requests/{ticket}(ticket=${order.ticketNumber})}" th:text="${order.ticketNumber}"></a></p>
<p>Status: <span th:text="${order.status}"></span></p><p class="prose" th:text="${order.resolutionNote}"></p>
<form th:if="${order.status.name() == 'CREATED' or order.status.name() == 'REOPENED'}" th:action="@{/workorders/{id}/accept(id=${order.id})}" method="post"><button>Accept and start work</button></form>
<h2>Repair records</h2><p th:if="${#lists.isEmpty(records)}">No repair records yet.</p>
<article th:each="record : ${records}"><h3 th:text="${record.createdAt}"></h3>
<p>Technician: <span th:text="${record.technicianId}"></span></p><p class="prose" th:text="${record.diagnosis}"></p><p class="prose" th:text="${record.actionTaken}"></p>
<p th:text="${record.materialsUsed}"></p><p><span th:text="${record.minutesSpent}"></span> minutes</p>
<a th:if="${record.evidenceAttachmentId != null}" th:href="@{/requests/{ticket}/attachments/{id}(ticket=${order.ticketNumber},id=${record.evidenceAttachmentId})}">View evidence</a></article>
<section th:if="${order.status.name() == 'IN_PROGRESS' or order.status.name() == 'ON_HOLD'}">
<form th:action="@{/workorders/{id}/records(id=${order.id})}" th:object="${repair}" method="post">
<ul th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
<label>Diagnosis<textarea th:field="*{diagnosis}" maxlength="2000" required></textarea></label>
<label>Action taken<textarea th:field="*{actionTaken}" maxlength="2000" required></textarea></label>
<label>Materials used<textarea th:field="*{materialsUsed}" maxlength="1000"></textarea></label>
<label>Time spent (minutes)<input th:field="*{minutesSpent}" type="number" min="1" required></label>
<label>Related photo (optional)<select th:field="*{evidenceAttachmentId}"><option value="">No photo</option>
<option th:each="photo : ${evidence}" th:value="${photo.id}" th:text="${photo.originalFilename}"></option></select></label><button>Add repair record</button></form>
<form th:action="@{/workorders/{id}/complete(id=${order.id})}" th:object="${completion}" method="post">
<ul th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
<label>Solution<textarea th:field="*{resolutionNote}" maxlength="500" required></textarea></label><button>Submit solution</button></form>
</section>
</main></body></html>
