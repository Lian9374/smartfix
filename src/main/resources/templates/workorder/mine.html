<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${historyView} ? 'Repair history' : 'Engineer workspace')}"><title>Engineer workspace · SmartFix</title></head>
<body><div class="app-shell"><div class="app-main"><th:block th:replace="~{fragments/layout :: appbar(${historyView} ? 'repair-history' : 'work-orders')}"></th:block>
<main id="main-content" class="content engineer-workspace">
  <header class="engineer-hero"><div><span class="section-kicker" th:text="${historyView} ? 'Your repair record' : 'Your repair desk'">Your repair desk</span><h1 th:text="${historyView} ? 'Repair history' : 'Engineer workspace'">Engineer workspace</h1><p th:text="${historyView} ? 'Completed repairs, including those awaiting acceptance.' : 'Your assigned repairs. A clear next step.'">Your assigned repairs. A clear next step.</p><a class="engineer-profile-link" th:href="@{/technician/profile}">Profile settings <span aria-hidden="true">↗</span></a></div><div class="engineer-hero__visual"><img th:src="@{/images/engineer-workspace.png}" width="240" height="210" alt="" aria-hidden="true" decoding="async"></div></header>
  <section class="card engineer-orders" aria-labelledby="work-orders-title">
    <div class="card__header"><h2 id="work-orders-title" class="card__title" th:text="${historyView} ? 'Completed work orders' : 'My work orders'">My work orders</h2><span class="engineer-result-count" th:text="${orders.totalElements == 1} ? '1 work order' : |${orders.totalElements} work orders|"></span></div>
    <form class="engineer-filters" th:action="@{/technician}" method="get" aria-label="Filter work orders">
      <input type="hidden" name="view" th:value="${queueView}"><div class="engineer-filters__main">
        <div class="form-field"><label for="work-status">Status</label><select id="work-status" name="status"><option value="">All statuses</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item.name() == 'CREATED' ? 'Ready to start' : #strings.capitalize(#strings.toLowerCase(#strings.replace(item.toString(),'_',' ')))}" th:selected="${item == selectedStatus}"></option></select></div>
        <div class="form-field"><label for="work-priority">Priority</label><select id="work-priority" name="priority"><option value="">All priorities</option><option th:each="item : ${priorities}" th:value="${item}" th:text="${#strings.capitalize(#strings.toLowerCase(item.toString()))}" th:selected="${item == selectedPriority}"></option></select></div>
        <div class="form-field"><label for="queue-sort">Sort by</label><select id="queue-sort" name="sort"><option value="newest" th:selected="${selectedSort == 'newest'}">Newest first</option><option value="oldest" th:selected="${selectedSort == 'oldest'}">Oldest first</option><option value="updated" th:selected="${selectedSort == 'updated'}">Recently updated</option></select></div>
        <input type="hidden" name="size" th:value="${orders.size}"><button class="btn btn--primary" type="submit">Apply filters</button><a class="engineer-filter-clear" th:href="@{/technician(view=${queueView})}">Clear</a>
      </div>
      <details class="engineer-extra-filters" th:open="${since != null}"><summary>More filters <span class="engineer-date-active" th:if="${since != null}">Date filter applied</span><span aria-hidden="true">⌄</span></summary><div class="form-field"><label for="work-since">Created since <span class="meta">(UTC)</span></label><input id="work-since" type="date" name="since" th:value="${since}"></div></details>
    </form>
    <div class="engineer-empty" th:if="${orders.empty}"><span class="engineer-empty__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4V2h6v2M9 10h6m-6 4h4"/></svg></span><h3 th:text="${selectedStatus != null or selectedPriority != null or since != null} ? 'No matching work orders' : (${historyView} ? 'No completed repairs yet' : 'No assigned repairs yet')">No assigned repairs yet</h3><p th:text="${selectedStatus != null or selectedPriority != null or since != null} ? 'Adjust your filters to find other assignments.' : (${historyView} ? 'Completed repairs will appear here when you submit your work.' : 'Your next assignment will appear here when an administrator assigns it to you.')"></p></div>
    <div class="engineer-order-list" th:unless="${orders.empty}"><a class="engineer-order" th:each="order : ${orders.content}" th:href="@{/workorders/{id}(id=${order.id})}"><span class="engineer-order__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6m-6 4h6m-6 4h3"/></svg></span><div class="engineer-order__copy"><span class="engineer-ticket" th:text="${order.ticketNumber}"></span><h3 th:text="${order.title}"></h3><p class="engineer-location" th:text="${locationNames[order.locationId]}"></p><time th:datetime="${order.updatedAt}" th:text="|Updated ${#temporals.format(order.updatedAt,'dd MMM, HH:mm','Asia/Singapore')} · SGT|"></time></div><div class="engineer-order__state"><span th:replace="~{fragments/components :: statusBadge(${order.requestStatus})}"></span><span th:replace="~{fragments/components :: urgencyBadge(${order.priority})}"></span></div><span class="engineer-order__arrow" aria-hidden="true">↗</span></a></div>
    <nav class="engineer-pagination" th:if="${orders.hasPrevious() or orders.hasNext()}" aria-label="Work order pages"><a class="btn btn--secondary" th:if="${orders.hasPrevious()}" th:href="@{/technician(page=${orders.number-1},size=${orders.size},status=${selectedStatus},priority=${selectedPriority},since=${since},sort=${selectedSort},view=${queueView})}">Previous</a><span th:text="|Page ${orders.number+1} of ${orders.totalPages}|"></span><a class="btn btn--secondary" th:if="${orders.hasNext()}" th:href="@{/technician(page=${orders.number+1},size=${orders.size},status=${selectedStatus},priority=${selectedPriority},since=${since},sort=${selectedSort},view=${queueView})}">Next</a></nav>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></div></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
