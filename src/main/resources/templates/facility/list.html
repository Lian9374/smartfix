<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facilities')}"><title>Facilities · SmartFix</title></head>
<body><div class="app-shell"><th:block th:replace="~{fragments/layout :: sidebar('facilities')}"></th:block><div class="app-main"><th:block th:replace="~{fragments/layout :: appbar('facilities')}"></th:block>
<main id="main-content" class="content workspace-page admin-steward-page facility-management">
  <header class="steward-hero"><div><span class="section-kicker">Campus equipment</span><h1>Facilities</h1><p>Keep equipment and its availability up to date.</p></div><img th:src="@{/images/engineer-dispatch.png}" width="170" height="155" alt="" aria-hidden="true"></header>
  <output class="alert alert--success" role="status" th:if="${successMessage}" th:text="${successMessage}"></output>
  <details class="card facility-create" th:open="${facilityFormInvalid == true}"><summary><span class="steward-add" aria-hidden="true">＋</span><span>Add facility</span><span class="steward-chevron" aria-hidden="true">⌄</span></summary>
    <form th:action="@{/admin/facilities}" method="post" th:object="${createFacility}">
      <ul class="alert alert--error" role="alert" th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
      <div class="form-grid"><div class="form-field"><label for="facility-name">Facility name</label><input type="text" id="facility-name" th:field="*{name}" required maxlength="120" placeholder="e.g. Level 1 water dispenser" th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null"><span class="form-field__error" th:errors="*{name}"></span></div>
      <div class="form-field"><label for="facility-location">Location</label><select id="facility-location" th:field="*{locationId}" required th:attr="aria-invalid=${#fields.hasErrors('locationId')} ? 'true' : null"><option value="">Select a campus location</option><option th:each="location : ${locations}" th:value="${location.id}" th:text="${location.displayName}"></option></select><span class="form-field__error" th:errors="*{locationId}"></span></div>
      <div class="form-field"><label for="facility-initial-status">Current status</label><select id="facility-initial-status" th:field="*{status}" required><option th:each="item : ${facilityStatuses}" th:value="${item}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(item.toString(),'_',' ')))}"></option></select></div>
      <div class="form-field"><label for="facility-description">Description <span class="meta">(optional)</span></label><textarea id="facility-description" th:field="*{description}" rows="3" maxlength="500" placeholder="Details that help identify this equipment"></textarea><span class="form-field__error" th:errors="*{description}"></span></div></div>
      <div class="form-actions"><button class="btn btn--primary" type="submit" th:disabled="${#lists.isEmpty(locations)}">Add facility</button><span class="meta" th:if="${#lists.isEmpty(locations)}">A registered campus location is required first.</span></div>
    </form>
  </details>
  <section class="card facility-directory" aria-labelledby="facilities-title"><div class="card__header"><h2 id="facilities-title" class="card__title">Equipment directory</h2><span class="steward-count" th:text="${#lists.size(facilities) == 1} ? '1 facility' : |${#lists.size(facilities)} facilities|"></span></div>
    <div th:if="${#lists.isEmpty(facilities)}" class="steward-empty"><span class="steward-empty__symbol" aria-hidden="true">＋</span><h3>No equipment registered yet</h3><p>Add a facility above to track its operational status on the campus map.</p></div>
    <article class="facility-row" th:each="facility : ${facilities}"><div class="facility-row__copy"><span class="section-kicker" th:text="${facility.locationDisplayName}"></span><h3 th:text="${facility.name}"></h3><p th:if="${facility.description != null}" th:text="${facility.description}"></p></div><div class="facility-row__status"><span th:replace="~{fragments/components :: badge(${#strings.capitalize(#strings.toLowerCase(#strings.replace(facility.status.toString(),'_',' ')))}, ${facility.status.name() == 'OPERATIONAL'} ? 'success' : (${facility.status.name() == 'OUT_OF_SERVICE'} ? 'danger' : 'warning'))}"></span>
    <details><summary>Update status <span aria-hidden="true">⌄</span></summary><form th:action="@{/admin/facilities/{facilityId}/status(facilityId=${facility.id})}" method="post" data-confirm="Change this facility’s operational status? The campus map will reflect this change."><label th:for="|facility-status-${facility.id}|">Operational status</label><select th:id="|facility-status-${facility.id}|" name="status"><option th:each="item : ${facilityStatuses}" th:value="${item}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(item.toString(),'_',' ')))}" th:selected="${item == facility.status}"></option></select><button class="btn btn--secondary" type="submit">Update</button></form></details></div></article>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></div></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
