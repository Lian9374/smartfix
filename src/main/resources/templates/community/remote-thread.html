<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Test discussion')}"><title>Test discussion</title></head><body><div class="app-shell"><th:block th:replace="~{fragments/layout :: sidebar('community')}"></th:block><div class="app-main"><th:block th:replace="~{fragments/layout :: appbar('community')}"></th:block><main id="main-content" class="content">
<a th:href="@{/community}">Back to community</a><section class="card"><p>Test discussion · replies and notifications</p><p th:if="${loadMessage != null}" th:text="${loadMessage}"></p><div th:if="${thread != null}"><h1 th:text="${thread.title}"></h1><p th:text="${thread.authorDisplayName}"></p><p style="white-space:pre-wrap" th:text="${thread.body}"></p><article th:each="answer : ${thread.answers}"><h2 th:text="${answer.authorDisplayName}"></h2><p style="white-space:pre-wrap" th:text="${answer.body != null ? answer.body : 'This answer is no longer public.'}"></p></article></div></section>
<section class="card"><h2>Reply</h2><p th:if="${submissionMessage != null}" th:text="${submissionMessage}"></p><form method="post" th:action="@{/community/questions/900000000001/answers}" th:object="${answerCommand}"><input type="hidden" name="commandKey" th:value="${commandKey}"><p th:if="${#fields.hasAnyErrors()}" th:errors="*{body}"></p><label for="answer-body">Your answer</label><textarea id="answer-body" th:field="*{body}" minlength="10" maxlength="4000" required></textarea><button class="btn btn--primary" type="submit">Post answer</button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
