<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Review Maintenance Request')}"><title>Review Maintenance Request · SmartFix</title></head>
<body>
<div class="app-shell">
  <th:block th:replace="~{fragments/layout :: sidebar('request-lookup')}"></th:block>
  <div class="app-main">
    <th:block th:replace="~{fragments/layout :: appbar('request-lookup')}"></th:block>
    <main id="main-content" class="content request-workflow workflow-stack">
      <div th:replace="~{fragments/components :: pageHeading('Review Maintenance Request', 'Set the final priority or explain why the request is rejected.')}"></div>
      <section class="card" aria-labelledby="review-request-title">
        <div class="card__header"><h2 class="card__title" id="review-request-title" th:text="${request.title}"></h2><a class="card__link" th:href="@{/requests/{ticket}(ticket=${request.ticketNumber})}" th:text="${request.ticketNumber}"></a></div>
        <div class="card__body workflow-stack">
          <p class="prose" th:text="${request.description}"></p>
          <form class="workflow-stack" th:action="@{/requests/{ticket}/review(ticket=${request.ticketNumber})}" th:object="${command}" method="post">
            <ul class="alert alert--error" role="alert" th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
            <div class="form-field"><label class="form-field__label" for="finalUrgencyLevel">Final priority</label><select id="finalUrgencyLevel" th:field="*{finalUrgencyLevel}" required><option th:each="priority : ${urgencyLevels}" th:value="${priority}" th:text="${priority}"></option></select><span class="form-field__error" th:errors="*{finalUrgencyLevel}"></span></div>
            <label class="workflow-actions"><input type="checkbox" th:field="*{reject}">Reject this request</label>
            <div class="form-field"><label class="form-field__label" for="comment">Reason (required when rejecting)</label><textarea id="comment" th:field="*{comment}" maxlength="500" rows="4"></textarea><span class="form-field__error" th:errors="*{comment}"></span></div>
            <div class="workflow-actions"><button class="btn btn--primary" type="submit">Save review</button><a class="btn btn--secondary" th:href="@{/requests/{ticket}(ticket=${request.ticketNumber})}">Back to request</a></div>
          </form>
        </div>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
