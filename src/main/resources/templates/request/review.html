<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Maintenance Request - SmartFix</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body><header><h1>Review Maintenance Request</h1><nav><a th:href="@{/}">Home</a></nav></header><main>
<p><a th:href="@{/requests/{ticket}(ticket=${request.ticketNumber})}" th:text="${request.ticketNumber}"></a></p>
<h2 th:text="${request.title}"></h2><p class="prose" th:text="${request.description}"></p>
<form th:action="@{/requests/{ticket}/review(ticket=${request.ticketNumber})}" th:object="${command}" method="post">
  <ul th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
  <label for="finalUrgencyLevel">Final priority</label><select id="finalUrgencyLevel" th:field="*{finalUrgencyLevel}" required>
    <option th:each="priority : ${urgencyLevels}" th:value="${priority}" th:text="${priority}"></option>
  </select>
  <label><input type="checkbox" th:field="*{reject}">Reject this request</label>
  <label for="comment">Reason (required when rejecting)</label><textarea id="comment" th:field="*{comment}" maxlength="500"></textarea>
  <button type="submit">Save review</button>
</form>
</main></body></html>
