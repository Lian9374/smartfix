# Extra overlay, only for the disposable load-test project. Never production.
services:
  app:
    cpus: 2.0
    mem_limit: 1024m
    environment:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "10"
      # Fixture registration only: allow >5 synthetic accounts from one loopback
      # address. Authentication/CSRF/RBAC stay enabled. No measured registration.
      SMARTFIX_REGISTRATION_MAX_PER_ADDRESS: "1000"
      SMARTFIX_DELIVERY_EAGER_ENABLED: "false"
  db:
    cpus: 1.0
    mem_limit: 512m
