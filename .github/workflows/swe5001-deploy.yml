name: SWE5001 deploy approved AWS stack
on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: Existing dedicated stack name
        required: true
        default: smartfix-swe5001
      cost_approved:
        description: Owner has approved AWS costs and this deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: swe5001-aws-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.cost_approved && github.ref == 'refs/heads/swe5001-cloud-native'
    environment: swe5001-demo
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ inputs.stack_name }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      COST_APPROVED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests before publishing
        run: |
          mvn -B verify
          cd services/notification-worker && python3 -m unittest discover -s tests -v
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable images
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json)
          core=$(jq -r '.[] | select(.OutputKey=="CoreRepository") | .OutputValue' <<< "$outputs")
          worker=$(jq -r '.[] | select(.OutputKey=="WorkerRepository") | .OutputValue' <<< "$outputs")
          docker buildx build --platform linux/amd64 --push -t "$core:$IMAGE_TAG" .
          docker buildx build --platform linux/amd64 --push -t "$worker:$IMAGE_TAG" services/notification-worker
      - name: Deploy, initialize databases and smoke test
        run: bash scripts/swe5001/deploy.sh
