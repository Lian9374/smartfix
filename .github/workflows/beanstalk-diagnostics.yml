name: SmartFix Beanstalk Delivery Diagnostics (No Deployment)

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: Existing CI ZIP key in the SmartFix release bucket
        required: true
        type: string
      confirm_probe:
        description: Authorize a temporary S3 copy, non-public ACL test and cleanup; no deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: smartfix-beanstalk-delivery-diagnostics
  cancel-in-progress: false

jobs:
  delivery-probe:
    name: Same-role S3 delivery probe (No Deployment)
    if: >-
      github.repository == 'Lian9374/smartfix' &&
      github.ref == 'refs/heads/main' && inputs.confirm_probe == true
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: beanstalk
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      DIAGNOSTIC_REQUESTED: 'true'
      DIAGNOSTIC_SOURCE_KEY: ${{ inputs.source_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test diagnostic guards, failure handling and scoped cleanup
        run: python3 -m unittest discover -s deploy/beanstalk -p 'test_diagnose.py' -v
      - name: Obtain the existing deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_BEANSTALK_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: smartfix-diagnostic-${{ github.run_id }}
      - name: Probe the exact S3 handoff with a random temporary object; never update the environment
        run: python3 deploy/beanstalk/diagnose.py --source-key "$DIAGNOSTIC_SOURCE_KEY"
      - name: Save actual probe result even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swe5006-delivery-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/deployment-diagnostics/
          if-no-files-found: error
          retention-days: 30
