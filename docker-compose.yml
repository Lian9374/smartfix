# ============================================================
# SmartFix local development environment
# ------------------------------------------------------------
#   1. `docker compose up -d db`     -> start PostgreSQL only
#   2. `mvn spring-boot:run`         -> run the app on the host
#                                       (SPRING_PROFILES_ACTIVE=dev)
#
#   Optionally run the app itself inside Docker:
#   3. `docker compose --profile app up --build`
#
# Environment variables are read from the `.env` file when present
# (see .env.example). No real secrets are committed.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: smartfix-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfix}
      POSTGRES_USER: ${POSTGRES_USER:-smartfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfix}
    # Host port is configurable (DB_PORT). If 5432 is already used by a locally
    # installed PostgreSQL, run:  DB_PORT=5433 docker compose up -d db
    # and point the app at it, e.g. DB_URL=jdbc:postgresql://localhost:5433/smartfix
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - smartfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfix} -d ${POSTGRES_DB:-smartfix}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional: run the Spring Boot application in a container.
  # Opt-in via: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfix-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartfix}
      DB_USERNAME: ${POSTGRES_USER:-smartfix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartfix}
      SMARTFIX_BOOTSTRAP_ADMIN_ENABLED: ${SMARTFIX_BOOTSTRAP_ADMIN_ENABLED:-false}
      SMARTFIX_BOOTSTRAP_ADMIN_USERNAME: ${SMARTFIX_BOOTSTRAP_ADMIN_USERNAME:-}
      SMARTFIX_BOOTSTRAP_ADMIN_PASSWORD: ${SMARTFIX_BOOTSTRAP_ADMIN_PASSWORD:-}
      SMARTFIX_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${SMARTFIX_BOOTSTRAP_ADMIN_DISPLAY_NAME:-SmartFix Administrator}
      SMARTFIX_SESSION_TIMEOUT: ${SMARTFIX_SESSION_TIMEOUT:-30m}
      SMARTFIX_SESSION_COOKIE_SECURE: ${SMARTFIX_SESSION_COOKIE_SECURE:-false}
      SMARTFIX_DELIVERY_MAX_ATTEMPTS: ${SMARTFIX_DELIVERY_MAX_ATTEMPTS:-4}
      SMARTFIX_DELIVERY_BATCH_SIZE: ${SMARTFIX_DELIVERY_BATCH_SIZE:-50}
      SMARTFIX_DELIVERY_RETRY_SECONDS: ${SMARTFIX_DELIVERY_RETRY_SECONDS:-1}
      SMARTFIX_DELIVERY_SCAN_MILLISECONDS: ${SMARTFIX_DELIVERY_SCAN_MILLISECONDS:-15000}
      SMARTFIX_DELIVERY_SCHEDULING_ENABLED: ${SMARTFIX_DELIVERY_SCHEDULING_ENABLED:-true}
      SMARTFIX_DELIVERY_EAGER_ENABLED: ${SMARTFIX_DELIVERY_EAGER_ENABLED:-true}
      SMARTFIX_NOTIFICATION_EMAIL_ENABLED: ${SMARTFIX_NOTIFICATION_EMAIL_ENABLED:-false}
      SMARTFIX_NOTIFICATION_EMAIL_FROM: ${SMARTFIX_NOTIFICATION_EMAIL_FROM:-smartfix@localhost}
      SMARTFIX_SMTP_HOST: ${SMARTFIX_SMTP_HOST:-localhost}
      SMARTFIX_SMTP_PORT: ${SMARTFIX_SMTP_PORT:-25}
      SMARTFIX_SMTP_USERNAME: ${SMARTFIX_SMTP_USERNAME:-}
      SMARTFIX_SMTP_PASSWORD: ${SMARTFIX_SMTP_PASSWORD:-}
      SMARTFIX_SMTP_AUTH: ${SMARTFIX_SMTP_AUTH:-false}
      SMARTFIX_SMTP_STARTTLS: ${SMARTFIX_SMTP_STARTTLS:-false}
      SMARTFIX_SMTP_HEALTH_ENABLED: ${SMARTFIX_SMTP_HEALTH_ENABLED:-false}
      SMARTFIX_SLA_SCAN_MILLISECONDS: ${SMARTFIX_SLA_SCAN_MILLISECONDS:-60000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smartfix_pgdata:
